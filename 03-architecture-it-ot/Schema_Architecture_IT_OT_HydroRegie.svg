<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1030" width="1200" height="1030" font-family="Helvetica, Arial, sans-serif">
  <title>HydroRégie — Architecture réseau segmentée IT/OT</title>
  <desc>Schéma par zones (modèle de Purdue, ISA/IEC 62443) : DMZ périmétrique, SI de gestion, DMZ industrielle, OT centrale, sites de production, sites distants, SIS isolé, supervision hors bande.</desc>
  <style>
    .t { font-size: 11px; fill: #1b2a3a; }
    .tb { font-size: 11.5px; font-weight: bold; fill: #1b2a3a; }
    .lab { font-size: 12px; font-weight: bold; fill: #1b2a3a; }
    .lbl { font-size: 10px; fill: #3a4a5a; font-style: italic; }
    .fwt { font-size: 11.5px; font-weight: bold; fill: #ffffff; }
    .bx { fill: #ffffff; stroke-width: 1.3; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1b2a3a"/></marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C9700A"/></marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8E44AD"/></marker>
  </defs>

  <rect width="1200" height="1030" fill="#ffffff"/>
  <text x="30" y="28" font-size="18" font-weight="bold" fill="#1b2a3a">HydroRégie — Architecture réseau segmentée IT/OT</text>
  <text x="30" y="46" font-size="11.5" fill="#3a4a5a">Zones et conduits ISA/IEC 62443 · niveaux de Purdue · C = criticité (C1 la plus élevée) · SL-T = niveau de sécurité cible (proposition)</text>

  <!-- Bandes de zones -->
  <rect x="30" y="156" width="900" height="86" rx="8" fill="#FFF4E5" stroke="#E8890C" stroke-width="1.5"/>
  <text x="920" y="174" text-anchor="end" class="lab">Z1 · DMZ périmétrique — C3 — SL-T 2</text>

  <rect x="30" y="262" width="900" height="100" rx="8" fill="#E8F0FE" stroke="#2F6FDB" stroke-width="1.5"/>
  <text x="920" y="280" text-anchor="end" class="lab">Z2 · SI de gestion IT (Purdue 4-5) — C4 — SL-T 2</text>

  <rect x="30" y="424" width="900" height="100" rx="8" fill="#F3E8FF" stroke="#8E44AD" stroke-width="1.5"/>
  <text x="920" y="442" text-anchor="end" class="lab">Z3 · DMZ industrielle iDMZ (Purdue 3.5) — C2 — SL-T 3</text>

  <rect x="30" y="586" width="900" height="100" rx="8" fill="#E6F4EA" stroke="#1E8E3E" stroke-width="1.5"/>
  <text x="920" y="604" text-anchor="end" class="lab">Z4 · Exploitation OT centrale (Purdue 3) — C2 — SL-T 3</text>

  <rect x="30" y="752" width="400" height="126" rx="8" fill="#E6F4EA" stroke="#1E8E3E" stroke-width="1.5"/>
  <text x="46" y="772" class="lab">Z5 · Production usines A et B</text>
  <text x="46" y="787" class="t">Purdue 0-2 · C1 · SL-T 3</text>

  <rect x="445" y="752" width="285" height="126" rx="8" fill="#E6F4EA" stroke="#1E8E3E" stroke-width="1.5"/>
  <text x="460" y="772" class="lab">Z7 · Sites distants (~15)</text>
  <text x="460" y="787" class="t">réservoirs, stations · C1 · SL-T 3</text>

  <rect x="745" y="752" width="185" height="126" rx="8" fill="#FDECEC" stroke="#C0392B" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="760" y="772" class="lab">Z6 · SIS (sûreté)</text>
  <text x="760" y="787" class="t">isolé · C1 · SL-T 3</text>

  <!-- Panneau supervision -->
  <rect x="950" y="262" width="230" height="308" rx="8" fill="#FFF9DB" stroke="#B8860B" stroke-width="1.5"/>
  <text x="1065" y="282" text-anchor="middle" class="lab">Z8 · Supervision et</text>
  <text x="1065" y="297" text-anchor="middle" class="lab">administration hors bande</text>
  <text x="1065" y="312" text-anchor="middle" class="t">C2 · SL-T 3</text>

  <!-- Légende -->
  <rect x="950" y="62" width="230" height="190" rx="8" fill="#ffffff" stroke="#9aa7b4" stroke-width="1"/>
  <text x="962" y="82" class="lab">Légende</text>
  <rect x="962" y="92" width="14" height="14" fill="#FFF4E5" stroke="#E8890C"/><text x="984" y="103" class="t">DMZ périmétrique</text>
  <rect x="962" y="112" width="14" height="14" fill="#E8F0FE" stroke="#2F6FDB"/><text x="984" y="123" class="t">SI de gestion (IT)</text>
  <rect x="962" y="132" width="14" height="14" fill="#F3E8FF" stroke="#8E44AD"/><text x="984" y="143" class="t">DMZ industrielle (iDMZ)</text>
  <rect x="962" y="152" width="14" height="14" fill="#E6F4EA" stroke="#1E8E3E"/><text x="984" y="163" class="t">OT (centrale, sites)</text>
  <rect x="962" y="172" width="14" height="14" fill="#FFF9DB" stroke="#B8860B"/><text x="984" y="183" class="t">Supervision hors bande</text>
  <rect x="962" y="192" width="14" height="14" fill="#9B1C1C"/><text x="984" y="203" class="t">Pare-feu (haute disponibilité)</text>
  <line x1="962" y1="220" x2="990" y2="220" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arr)"/><text x="998" y="224" class="t">flux autorisé</text>
  <line x1="962" y1="238" x2="990" y2="238" stroke="#8E44AD" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arrP)"/><text x="998" y="242" class="t">tunnel IPsec</text>

  <!-- Flux (sous les boîtes et les pare-feux) -->
  <rect x="330" y="62" width="300" height="36" rx="8" fill="#EEF1F4" stroke="#9aa7b4" stroke-width="1.3"/>
  <text x="480" y="84" text-anchor="middle" class="tb">Internet · Fournisseurs · Agents nomades</text>
  <line x1="480" y1="98" x2="480" y2="118" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="480" y1="140" x2="480" y2="156" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arr)"/>

  <line x1="505" y1="230" x2="505" y2="290" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="515" y="256" class="lbl">flux DMZ → IT filtrés par le NGFW (HTTPS)</text>

  <path d="M100 207 H62 V480 H100" fill="none" stroke="#C9700A" stroke-width="2.4" marker-end="url(#arrO)"/>
  <text transform="rotate(-90 50 316)" x="50" y="316" text-anchor="middle" font-size="10" fill="#8a4a05" font-weight="bold">Fournisseurs : MFA 1 → 2</text>

  <line x1="330" y1="344" x2="330" y2="452" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="340" y="376" class="lbl">lecture seule (IT → iDMZ)</text>

  <line x1="175" y1="508" x2="175" y2="614" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="185" y="538" class="lbl">RDP / SSH · fenêtre horaire</text>

  <line x1="400" y1="614" x2="400" y2="508" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="410" y="580" class="lbl">réplication initiée depuis l'OT</text>

  <line x1="230" y1="670" x2="230" y2="700" stroke="#1b2a3a" stroke-width="1.6"/>
  <line x1="230" y1="722" x2="230" y2="752" stroke="#1b2a3a" stroke-width="1.6" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="240" y="744" class="lbl">Modbus/TCP · DNP3 · OPC UA (liste blanche)</text>

  <path d="M640 752 V740 H790 V672" fill="none" stroke="#8E44AD" stroke-width="1.8" stroke-dasharray="6 4" marker-start="url(#arrP)" marker-end="url(#arrP)"/>
  <text x="780" y="735" text-anchor="end" class="lbl">IPsec site à site · WAN privé + 4G</text>

  <!-- Boîtes Z1 -->
  <rect class="bx" x="100" y="184" width="250" height="46" rx="6" stroke="#E8890C"/>
  <text x="225" y="203" text-anchor="middle" class="tb">Portail d'accès distant</text>
  <text x="225" y="218" text-anchor="middle" class="t">MFA n°1 · fournisseurs, agents</text>
  <rect class="bx" x="380" y="184" width="250" height="46" rx="6" stroke="#E8890C"/>
  <text x="505" y="203" text-anchor="middle" class="tb">Reverse proxy</text>
  <text x="505" y="218" text-anchor="middle" class="t">portail usagers, services en ligne</text>
  <rect class="bx" x="660" y="184" width="250" height="46" rx="6" stroke="#E8890C"/>
  <text x="785" y="203" text-anchor="middle" class="tb">Relais messagerie</text>
  <text x="785" y="218" text-anchor="middle" class="t">filtrage anti-spam, anti-malware</text>

  <!-- Boîtes Z2 -->
  <rect class="bx" x="100" y="290" width="250" height="54" rx="6" stroke="#2F6FDB"/>
  <text x="225" y="311" text-anchor="middle" class="tb">AD IT · ERP · facturation</text>
  <text x="225" y="327" text-anchor="middle" class="t">postes et serveurs de gestion</text>
  <rect class="bx" x="380" y="290" width="250" height="54" rx="6" stroke="#2F6FDB"/>
  <text x="505" y="311" text-anchor="middle" class="tb">Messagerie · fichiers</text>
  <text x="505" y="327" text-anchor="middle" class="t">applications métier</text>
  <rect class="bx" x="660" y="290" width="250" height="54" rx="6" stroke="#2F6FDB"/>
  <text x="785" y="311" text-anchor="middle" class="tb">SIEM / SOC</text>
  <text x="785" y="327" text-anchor="middle" class="t">collecte des journaux IT et OT</text>

  <!-- Boîtes Z3 -->
  <rect class="bx" x="100" y="452" width="190" height="56" rx="6" stroke="#8E44AD"/>
  <text x="195" y="472" text-anchor="middle" class="tb">Bastion de télémaintenance</text>
  <text x="195" y="487" text-anchor="middle" class="t">MFA n°2 · session</text>
  <text x="195" y="500" text-anchor="middle" class="t">enregistrée</text>
  <rect class="bx" x="307" y="452" width="190" height="56" rx="6" stroke="#8E44AD"/>
  <text x="402" y="476" text-anchor="middle" class="tb">Historian réplica</text>
  <text x="402" y="492" text-anchor="middle" class="t">lecture seule par l'IT</text>
  <rect class="bx" x="514" y="452" width="190" height="56" rx="6" stroke="#8E44AD"/>
  <text x="609" y="476" text-anchor="middle" class="tb">WSUS · antivirus relais</text>
  <text x="609" y="492" text-anchor="middle" class="t">sas de décontamination</text>
  <rect class="bx" x="721" y="452" width="190" height="56" rx="6" stroke="#8E44AD"/>
  <text x="816" y="476" text-anchor="middle" class="tb">Syslog · NTP · DNS OT</text>
  <text x="816" y="492" text-anchor="middle" class="t">relais journaux vers le SOC</text>

  <!-- Boîtes Z4 -->
  <rect class="bx" x="100" y="614" width="150" height="56" rx="6" stroke="#1E8E3E"/>
  <text x="175" y="636" text-anchor="middle" class="tb">Serveurs SCADA</text>
  <text x="175" y="652" text-anchor="middle" class="t">supervision centrale</text>
  <rect class="bx" x="265" y="614" width="150" height="56" rx="6" stroke="#1E8E3E"/>
  <text x="340" y="636" text-anchor="middle" class="tb">Historian primaire</text>
  <text x="340" y="652" text-anchor="middle" class="t">données de process</text>
  <rect class="bx" x="430" y="614" width="150" height="56" rx="6" stroke="#1E8E3E"/>
  <text x="505" y="636" text-anchor="middle" class="tb">Poste d'ingénierie</text>
  <text x="505" y="652" text-anchor="middle" class="t">programmation PLC</text>
  <rect class="bx" x="595" y="614" width="150" height="56" rx="6" stroke="#1E8E3E"/>
  <text x="670" y="636" text-anchor="middle" class="tb">AD OT</text>
  <text x="670" y="652" text-anchor="middle" class="t">domaine dédié, sans trust IT</text>
  <rect class="bx" x="760" y="614" width="150" height="56" rx="6" stroke="#1E8E3E"/>
  <text x="835" y="636" text-anchor="middle" class="tb">Concentrateur IPsec</text>
  <text x="835" y="652" text-anchor="middle" class="t">sites distants</text>

  <!-- Boîtes bas -->
  <rect class="bx" x="46" y="804" width="172" height="58" rx="6" stroke="#1E8E3E"/>
  <text x="132" y="828" text-anchor="middle" class="tb">HMI locaux</text>
  <text x="132" y="844" text-anchor="middle" class="t">conduite locale autonome</text>
  <rect class="bx" x="232" y="804" width="184" height="58" rx="6" stroke="#1E8E3E"/>
  <text x="324" y="828" text-anchor="middle" class="tb">PLC · RTU · E/S</text>
  <text x="324" y="844" text-anchor="middle" class="t">réseau de terrain isolé</text>
  <rect class="bx" x="460" y="804" width="255" height="58" rx="6" stroke="#1E8E3E"/>
  <text x="587" y="828" text-anchor="middle" class="tb">RTU / PLC + pare-feu compact</text>
  <text x="587" y="844" text-anchor="middle" class="t">autonomie locale en cas de coupure WAN</text>
  <rect class="bx" x="760" y="804" width="155" height="58" rx="6" stroke="#C0392B"/>
  <text x="837" y="823" text-anchor="middle" class="tb">Systèmes instrumentés</text>
  <text x="837" y="837" text-anchor="middle" class="tb">de sécurité</text>
  <text x="837" y="852" text-anchor="middle" class="t">aucun lien routable</text>

  <!-- Boîtes supervision -->
  <rect class="bx" x="966" y="326" width="198" height="100" rx="6" stroke="#B8860B"/>
  <text x="1065" y="350" text-anchor="middle" class="tb">Sondes OT passives</text>
  <text x="1065" y="366" text-anchor="middle" class="t">TAP / SPAN sur iDMZ, OT</text>
  <text x="1065" y="380" text-anchor="middle" class="t">centrale et sites</text>
  <text x="1065" y="396" text-anchor="middle" class="t">copie du trafic vers le SOC,</text>
  <text x="1065" y="410" text-anchor="middle" class="t">aucune écriture</text>
  <rect class="bx" x="966" y="440" width="198" height="112" rx="6" stroke="#B8860B"/>
  <text x="1065" y="464" text-anchor="middle" class="tb">Administration</text>
  <text x="1065" y="478" text-anchor="middle" class="tb">hors bande</text>
  <text x="1065" y="496" text-anchor="middle" class="t">accès aux pare-feux et</text>
  <text x="1065" y="510" text-anchor="middle" class="t">commutateurs, séparé des</text>
  <text x="1065" y="524" text-anchor="middle" class="t">flux de production</text>

  <!-- Pare-feux (au-dessus des flux) -->
  <rect x="30" y="118" width="900" height="22" rx="4" fill="#9B1C1C"/>
  <text x="480" y="133" text-anchor="middle" class="fwt">NGFW périmètre (HA) — interfaces Internet · DMZ · IT</text>
  <rect x="30" y="382" width="900" height="22" rx="4" fill="#9B1C1C"/>
  <text x="480" y="397" text-anchor="middle" class="fwt">Pare-feu IT / iDMZ (NGFW, HA) — aucun flux direct IT → OT</text>
  <rect x="30" y="544" width="900" height="22" rx="4" fill="#9B1C1C"/>
  <text x="480" y="559" text-anchor="middle" class="fwt">Pare-feu industriel iDMZ / OT (HA) — inspection Modbus · DNP3 · OPC UA — liste blanche</text>
  <rect x="30" y="700" width="400" height="22" rx="4" fill="#9B1C1C"/>
  <text x="230" y="715" text-anchor="middle" class="fwt">Pare-feux industriels de site (HA)</text>

  <!-- Bandeau continuité -->
  <rect x="30" y="900" width="1150" height="118" rx="8" fill="#F5F7FA" stroke="#c9d1d9" stroke-width="1"/>
  <text x="46" y="922" class="lab">Principes de continuité du service d'eau potable</text>
  <text x="46" y="944" class="tb">Autonomie locale</text>
  <text x="46" y="959" class="t">Chaque usine et chaque station pilote</text>
  <text x="46" y="973" class="t">sans dépendance au SI ni au WAN.</text>
  <text x="330" y="944" class="tb">Pas de pare-feu dans la boucle</text>
  <text x="330" y="959" class="t">Aucun filtrage en ligne entre PLC et E/S :</text>
  <text x="330" y="973" class="t">la segmentation entoure les boucles.</text>
  <text x="614" y="944" class="tb">Haute disponibilité</text>
  <text x="614" y="959" class="t">Pare-feux en cluster, double lien WAN,</text>
  <text x="614" y="973" class="t">alimentations secourues (onduleurs).</text>
  <text x="898" y="944" class="tb">Mise en service progressive</text>
  <text x="898" y="959" class="t">Règles testées en mode observation</text>
  <text x="898" y="973" class="t">avant blocage, retour arrière prévu.</text>
  <text x="46" y="1000" font-size="10.5" fill="#3a4a5a">Criticité : C1 critique (production, dosage, sûreté) · C2 élevée (SCADA, iDMZ, supervision) · C3 modérée (DMZ périmétrique) · C4 standard (SI de gestion)</text>
</svg>
